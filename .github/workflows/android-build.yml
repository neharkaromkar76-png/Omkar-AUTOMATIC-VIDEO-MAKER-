name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Build & Dependency Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          generate-job-summary: true

      - name: Prepare build environment & keystore
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Ensure debug.keystore exists for signing debug build
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 4. Make gradlew executable
        run: chmod +x gradlew

      - name: 5. Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 6. Find and verify generated APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file generated! Build failed."
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "::error::Generated APK is empty or invalid (size: $FILE_SIZE bytes)."
            exit 1
          fi
          echo "APK size: $FILE_SIZE bytes"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMKAR-AUTOMATIC-VIDEO-MAKER-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
