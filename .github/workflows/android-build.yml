name: Build OMKAR AUTOMATIC VIDEO MAKER APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project structure
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"
          find . -maxdepth 4 -type f | sort | head -500

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup environment
        shell: bash
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is missing."
            echo "The Android project must contain a Gradle wrapper."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties is missing."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --version

      - name: Show Gradle tasks
        shell: bash
        run: |
          ./gradlew tasks --all --no-daemon --console=plain

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find . -type f -name "*.apk" -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          echo "APK COUNT: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: Gradle completed but NO APK was generated."
            echo ""
            echo "Build directories:"
            find . -type d -name "build" -print
            exit 1
          fi

      - name: Prepare APK
        shell: bash
        run: |
          rm -rf release-apk
          mkdir -p release-apk

          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find . -type f -name "*.apk" | head -n 1)
          fi

          echo "Selected APK:"
          echo "$APK"

          cp "$APK" "release-apk/OMKAR-AUTOMATIC-VIDEO-MAKER-debug.apk"

          echo "======================================"
          echo "FINAL APK"
          echo "======================================"

          ls -lh release-apk/

          test -f "release-apk/OMKAR-AUTOMATIC-VIDEO-MAKER-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMKAR-AUTOMATIC-VIDEO-MAKER-debug
          path: release-apk/OMKAR-AUTOMATIC-VIDEO-MAKER-debug.apk
          if-no-files-found: error
          retention-days: 7
